plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '3.1.5'
}

group = 'com.roommade'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '5.3.39'
}

dependencies {
    // Spring
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-context:${springVersion}"

    // Connection pool
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // MyBatis
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    // JDBC / DB
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'

    // Flyway (DB 스키마 마이그레이션)
    implementation 'org.flywaydb:flyway-core:13.3.0'
    runtimeOnly 'org.flywaydb:flyway-mysql:13.3.0'

    // Servlet / JSON
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Bean validation (for @Valid request DTOs)
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    runtimeOnly 'org.glassfish:javax.el:3.0.1-b12'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    implementation 'org.slf4j:jcl-over-slf4j:2.0.13'

    // Test
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

gretty {
    contextPath = '/'
    servletContainer = 'tomcat9'
    httpPort = 8080
}

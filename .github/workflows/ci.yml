name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # main에서 수동으로 배포를 다시 실행할 때 쓴다(기본 브랜치에 이 파일이 있어야 Actions 탭에 나타난다).
  workflow_dispatch:

# PR/브랜치 검증은 새 푸시가 오면 이전 실행을 취소하되, main 배포 도중에는 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: roommade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (compile + test + package)
        run: ./gradlew build
        env:
          DB_JDBC_URL: "jdbc:mysql://127.0.0.1:3306/roommade?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
          DB_USERNAME: root
          DB_PASSWORD: ""

      # 테스트를 통과한 바로 이 WAR를 deploy job이 받아서 배포한다.
      - name: Upload WAR artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: roommade-war
          path: build/libs/*.war
          retention-days: 7
          if-no-files-found: error

  deploy:
    # main에서 build가 성공했을 때만 실행한다. PR과 develop 푸시에서는 건너뛴다.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      WEBAPPS_DIR: ${{ vars.DEPLOY_WEBAPPS_DIR }}
      SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: roommade-war
          path: dist

      - name: Resolve WAR path
        run: echo "WAR_PATH=$(find dist -maxdepth 1 -name '*.war' | head -n 1)" >> "$GITHUB_ENV"

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin server host key
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts

      - name: Copy WAR and deploy script to server
        run: |
          scp -P "${SSH_PORT}" \
            "${WAR_PATH}" scripts/deploy.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/"

      - name: Run deploy script on server
        run: |
          REMOTE_WAR="/tmp/$(basename "${WAR_PATH}")"
          # DEPLOY_HEALTH_URL(.../health)에서 베이스 주소를 뽑아 DB와 실제 조회 경로를 스모크 테스트한다.
          BASE_URL="${HEALTH_URL%/health}"
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "sudo bash /tmp/deploy.sh \
              --war '${REMOTE_WAR}' \
              --webapps-dir '${WEBAPPS_DIR}' \
              --service-name '${SERVICE_NAME}' \
              --health-url '${HEALTH_URL}' \
              --smoke-url '${BASE_URL}/health/db' \
              --smoke-url '${BASE_URL}/api/financial-products/deposits'"
